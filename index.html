<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Abdullah Handicraft Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      color: #2d2926;
    }

    header {
      background: #2d2926;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 7px 0 0;
      color: #ddd;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: 1px solid #ddd3ca;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #8b6f55;
    }

    .product {
      border: 1px solid #e5ddd5;
      padding: 16px;
      margin-top: 12px;
      border-radius: 14px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 8px 0;
    }

    .detail {
      margin: 6px 0;
      color: #625b55;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      margin: 7px 5px 0 0;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #2d2926;
      color: white;
    }

    .secondary {
      background: #eee7df;
      color: #2d2926;
    }

    .danger {
      background: #ead7d2;
      color: #6d2920;
    }

    .reply-box {
      background: #f5f1ec;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 100px;
    }

    .empty {
      color: #777;
      padding: 10px 0;
    }

    .small {
      font-size: 13px;
      color: #777;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Abdullah Handicraft</h1>
    <p>Customer Assistant • Version 1</p>
  </header>


  <main>

    <!-- PRODUCT SEARCH -->
    <section class="card">

      <h2>🔎 Product Catalog</h2>

      <input
        type="text"
        id="search"
        placeholder="Search products..."
        oninput="displayProducts()"
      />

      <div id="products"></div>

    </section>


    <!-- ADD PRODUCT -->
    <section class="card">

      <h2>➕ Add New Product</h2>

      <input
        type="text"
        id="productName"
        placeholder="Product name"
      />

      <input
        type="number"
        id="productPrice"
        placeholder="Price (₹)"
      />

      <input
        type="text"
        id="fabric"
        placeholder="Fabric / Material"
      />

      <input
        type="text"
        id="top"
        placeholder="Top measurement (optional)"
      />

      <input
        type="text"
        id="bottom"
        placeholder="Bottom measurement (optional)"
      />

      <input
        type="text"
        id="dupatta"
        placeholder="Dupatta measurement (optional)"
      />

      <button class="primary" onclick="addProduct()">
        Add Product
      </button>

    </section>


    <!-- WHATSAPP REPLY -->
    <section class="card">

      <h2>💬 WhatsApp Reply Generator</h2>

      <p class="small">
        Select a product above to create a ready-to-send customer reply.
      </p>

      <div id="reply" class="reply-box">
        No product selected yet.
      </div>

      <button class="primary" onclick="copyReply()">
        📋 Copy Reply
      </button>

    </section>

  </main>


  <footer>
    © 2026 Abdullah Handicraft
  </footer>


  <script>

    /*
      ------------------------------------------------
      ABDULLAH HANDICRAFT
      PRODUCT DATABASE
      ------------------------------------------------
    */

    let products = JSON.parse(
      localStorage.getItem("abdullahProducts")
    );


    /*
      If there are no saved products,
      create the first product automatically.
    */

    if (!products) {

      products = [

        {
          name: "Cotton Light Dress",
          price: 350,
          fabric: "Cotton fabric",
          top: "2.25 meters",
          bottom: "2.25 meters",
          dupatta: "2.25 meters"
        }

      ];

      saveProducts();
    }


    let selectedProduct = null;


    /*
      ------------------------------------------------
      SAVE PRODUCTS
      ------------------------------------------------
    */

    function saveProducts() {

      localStorage.setItem(
        "abdullahProducts",
        JSON.stringify(products)
      );

    }


    /*
      ------------------------------------------------
      DISPLAY PRODUCTS
      ------------------------------------------------
    */

    function displayProducts() {

      const container =
        document.getElementById("products");

      const search =
        document.getElementById("search")
        .value
        .toLowerCase();


      const filteredProducts =
        products.filter(product =>
          product.name.toLowerCase().includes(search)
        );


      if (filteredProducts.length === 0) {

        container.innerHTML =
          `<div class="empty">
             No products found.
           </div>`;

        return;
      }


      container.innerHTML = "";


      filteredProducts.forEach((product) => {

        const originalIndex =
          products.indexOf(product);


        const productDiv =
          document.createElement("div");

        productDiv.className = "product";


        productDiv.innerHTML = `

          <div class="product-name">
            ${escapeHTML(product.name)}
          </div>

          <div class="price">
            ₹${Number(product.price).toLocaleString("en-IN")}
          </div>

          <div class="detail">
            🧵 Material:
            ${escapeHTML(product.fabric || "Not specified")}
          </div>

          ${
            product.top
            ? `<div class="detail">
                 👕 Top:
                 ${escapeHTML(product.top)}
               </div>`
            : ""
          }

          ${
            product.bottom
            ? `<div class="detail">
                 👖 Bottom:
                 ${escapeHTML(product.bottom)}
               </div>`
            : ""
          }

          ${
            product.dupatta
            ? `<div class="detail">
                 🧣 Dupatta:
                 ${escapeHTML(product.dupatta)}
               </div>`
            : ""
          }

          <button
            class="primary"
            onclick="generateReply(${originalIndex})"
          >
            💬 Generate Reply
          </button>

          <button
            class="danger"
            onclick="deleteProduct(${originalIndex})"
          >
            🗑 Delete
          </button>

        `;


        container.appendChild(productDiv);

      });

    }


    /*
      ------------------------------------------------
      GENERATE WHATSAPP REPLY
      ------------------------------------------------
    */

    function generateReply(index) {

      selectedProduct = products[index];

      const product = selectedProduct;


      let reply = `Hi 😊

${product.name}

Price: ₹${product.price}

Fabric: ${product.fabric || "Not specified"}`;

      if (product.top) {

        reply +=
          `\nTop: ${product.top}`;

      }

      if (product.bottom) {

        reply +=
          `\nBottom: ${product.bottom}`;

      }

      if (product.dupatta) {

        reply +=
          `\nDupatta: ${product.dupatta}`;

      }


      reply += `

If you'd like to order, please message us. 😊`;


      document.getElementById("reply")
        .textContent = reply;


      document.getElementById("reply")
        .scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

    }


    /*
      ------------------------------------------------
      COPY WHATSAPP REPLY
      ------------------------------------------------
    */

    async function copyReply() {

      const reply =
        document.getElementById("reply")
        .textContent;


      if (
        reply === "No product selected yet."
      ) {

        alert(
          "Please select a product first."
        );

        return;
      }


      try {

        await navigator.clipboard.writeText(reply);

        alert(
          "Reply copied! 📋"
        );

      }

      catch (error) {

        alert(
          "Copy failed. Please select the text manually."
        );

      }

    }


    /*
      ------------------------------------------------
      ADD PRODUCT
      ------------------------------------------------
    */

    function addProduct() {

      const name =
        document.getElementById("productName")
        .value
        .trim();

      const price =
        document.getElementById("productPrice")
        .value;

      const fabric =
        document.getElementById("fabric")
        .value
        .trim();

      const top =
        document.getElementById("top")
        .value
        .trim();

      const bottom =
        document.getElementById("bottom")
        .value
        .trim();

      const dupatta =
        document.getElementById("dupatta")
        .value
        .trim();


      if (!name || !price) {

        alert(
          "Please enter the product name and price."
        );

        return;
      }


      const newProduct = {

        name: name,

        price: Number(price),

        fabric: fabric,

        top: top,

        bottom: bottom,

        dupatta: dupatta

      };


      products.push(newProduct);


      saveProducts();


      displayProducts();


      clearForm();


      alert(
        "Product added successfully! 🎉"
      );

    }


    /*
      ------------------------------------------------
      CLEAR FORM
      ------------------------------------------------
    */

    function clearForm() {

      document.getElementById("productName")
        .value = "";

      document.getElementById("productPrice")
        .value = "";

      document.getElementById("fabric")
        .value = "";

      document.getElementById("top")
        .value = "";

      document.getElementById("bottom")
        .value = "";

      document.getElementById("dupatta")
        .value = "";

    }


    /*
      ------------------------------------------------
      DELETE PRODUCT
      ------------------------------------------------
    */

    function deleteProduct(index) {

      const product =
        products[index];


      const confirmed =
        confirm(
          `Delete "${product.name}"?`
        );


      if (!confirmed) {

        return;

      }


      products.splice(index, 1);


      saveProducts();


      displayProducts();

    }


    /*
      ------------------------------------------------
      SECURITY
      Prevent HTML injection from product names.
      ------------------------------------------------
    */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ------------------------------------------------
      START APP
      ------------------------------------------------
    */

    displayProducts();

  </script>

</body>
</html>
