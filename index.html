<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdullah Handicraft - Shop Manager</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f3ee;
color:#292522;
}

header{
background:#292522;
color:white;
padding:28px 18px;
text-align:center;
}

header h1{
margin:0;
font-size:28px;
}

header p{
margin:7px 0 0;
color:#ddd;
}

.container{
max-width:1000px;
margin:auto;
padding:18px;
}

.card{
background:white;
padding:20px;
margin-bottom:18px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
margin-top:0;
}

input,
select{
width:100%;
padding:13px;
margin:6px 0;
border:1px solid #ddd4cb;
border-radius:10px;
font-size:15px;
}

button{
border:none;
border-radius:10px;
padding:12px 16px;
margin:6px 4px 0 0;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#292522;
color:white;
}

.secondary{
background:#eee7df;
color:#292522;
}

.danger{
background:#ead8d3;
color:#722b22;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.stat{
background:#f5f1ec;
padding:16px;
border-radius:14px;
text-align:center;
}

.stat strong{
display:block;
font-size:24px;
margin-top:5px;
}

.order{
border:1px solid #e5ddd5;
border-radius:14px;
padding:16px;
margin-top:12px;
}

.order h3{
margin:0 0 8px;
}

.status{
display:inline-block;
padding:5px 10px;
border-radius:20px;
background:#eee7df;
font-size:12px;
margin-top:7px;
}

.total{
font-size:20px;
font-weight:bold;
margin-top:8px;
}

.reply{
background:#f5f1ec;
padding:16px;
border-radius:12px;
white-space:pre-wrap;
line-height:1.6;
min-height:120px;
}

.empty{
color:#777;
padding:10px 0;
}

footer{
text-align:center;
padding:25px;
color:#777;
font-size:13px;
}

@media(max-width:650px){

.stats{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>


<header>

<h1>Abdullah Handicraft</h1>

<p>Smart Shop Manager • Version 3</p>

</header>


<div class="container">


<!-- SALES SUMMARY -->

<section class="card">

<h2>📊 Shop Summary</h2>

<div class="stats">

<div class="stat">

Orders

<strong id="totalOrders">
0
</strong>

</div>


<div class="stat">

Confirmed

<strong id="confirmedOrders">
0
</strong>

</div>


<div class="stat">

Sales

<strong id="totalSales">
₹0
</strong>

</div>

</div>

</section>



<!-- ADD ORDER -->

<section class="card">

<h2>➕ Create New Order</h2>


<input
id="customerName"
placeholder="Customer name"
>


<input
id="customerPhone"
placeholder="Customer WhatsApp number"
>


<select id="orderProduct">

<option value="">
Select product
</option>

</select>


<input
id="quantity"
type="number"
value="1"
min="1"
placeholder="Quantity"
>


<select id="orderStatus">

<option value="Pending">
Pending
</option>

<option value="Confirmed">
Confirmed
</option>

<option value="Delivered">
Delivered
</option>

</select>


<button
class="primary"
onclick="createOrder()"
>

Create Order

</button>


</section>



<!-- ORDERS -->

<section class="card">

<h2>📦 Orders</h2>


<input
id="orderSearch"
placeholder="Search customer or product..."
oninput="displayOrders()"
>


<div id="orders"></div>


</section>



<!-- WHATSAPP -->

<section class="card">

<h2>💬 WhatsApp Order Message</h2>


<div
id="reply"
class="reply"
>

Select an order to generate a message.

</div>


<button
class="primary"
onclick="copyReply()"
>

📋 Copy Message

</button>


</section>


</div>



<footer>

© 2026 Abdullah Handicraft

</footer>



<script>


/* ==============================
   DATABASE
============================== */


let products =
JSON.parse(
localStorage.getItem("abdullahProducts")
) || [

{
name:"Cotton Light Dress",
category:"Dresses",
price:350,
fabric:"Cotton fabric",
top:"2.25 meters",
bottom:"2.25 meters",
dupatta:"2.25 meters",
stock:"Available"
}

];


let orders =
JSON.parse(
localStorage.getItem("abdullahOrders")
) || [];


let selectedOrder=null;



/* ==============================
   SAVE
============================== */


function saveProducts(){

localStorage.setItem(
"abdullahProducts",
JSON.stringify(products)
);

}


function saveOrders(){

localStorage.setItem(
"abdullahOrders",
JSON.stringify(orders)
);

}



/* ==============================
   PRODUCT DROPDOWN
============================== */


function loadProducts(){

const select=
document.getElementById("orderProduct");

select.innerHTML=
'<option value="">Select product</option>';


products.forEach((product,index)=>{

const option=
document.createElement("option");

option.value=index;

option.textContent=
`${product.name} - ₹${product.price}`;

select.appendChild(option);

});

}



/* ==============================
   CREATE ORDER
============================== */


function createOrder(){

const customerName=
document.getElementById("customerName")
.value.trim();


const phone=
document.getElementById("customerPhone")
.value.trim();


const productIndex=
document.getElementById("orderProduct")
.value;


const quantity=
Number(
document.getElementById("quantity")
.value
);


const status=
document.getElementById("orderStatus")
.value;


if(
!customerName ||
!productIndex ||
!quantity
){

alert(
"Please enter customer name, product and quantity."
);

return;

}


const product=
products[productIndex];


const total=
product.price * quantity;


const order={

id:
Date.now(),

customer:
customerName,

phone:
phone,

product:
product.name,

price:
product.price,

quantity:
quantity,

total:
total,

status:
status,

date:
new Date().toLocaleDateString("en-IN")

};


orders.unshift(order);


saveOrders();


displayOrders();


updateStats();


clearOrderForm();


alert(
"Order created successfully! 🎉"
);

}



/* ==============================
   DISPLAY ORDERS
============================== */


function displayOrders(){

const container=
document.getElementById("orders");


const search=
document.getElementById("orderSearch")
.value
.toLowerCase();


const filtered=
orders.filter(order=>

order.customer
.toLowerCase()
.includes(search)

||

order.product
.toLowerCase()
.includes(search)

);


if(filtered.length===0){

container.innerHTML=
'<div class="empty">No orders found.</div>';

return;

}


container.innerHTML="";


filtered.forEach(order=>{

const index=
orders.indexOf(order);


const div=
document.createElement("div");


div.className="order";


div.innerHTML=`

<h3>
👤 ${escapeHTML(order.customer)}
</h3>

<div>
📱 ${escapeHTML(order.phone || "No number")}
</div>

<div>
🛍️ ${escapeHTML(order.product)}
</div>

<div>
🔢 Quantity: ${order.quantity}
</div>

<div>
💵 Price: ₹${order.price}
</div>

<div class="total">
Total: ₹${order.total}
</div>

<div>
📅 ${order.date}
</div>

<div class="status">
${escapeHTML(order.status)}
</div>

<br>

<button
class="primary"
onclick="generateOrderMessage(${index})"
>

💬 WhatsApp Message

</button>


<button
class="secondary"
onclick="changeStatus(${index})"
>

🔄 Change Status

</button>


<button
class="danger"
onclick="deleteOrder(${index})"
>

🗑 Delete

</button>

`;


container.appendChild(div);

});

}



/* ==============================
   WHATSAPP MESSAGE
============================== */


function generateOrderMessage(index){

selectedOrder=
orders[index];


const order=
selectedOrder;


const message=

`Hi ${order.customer} 😊

Thank you for your order from Abdullah Handicraft! 🛍️

Product: ${order.product}
Quantity: ${order.quantity}
Total: ₹${order.total}

Order status: ${order.status}

Thank you for shopping with us! ❤️`;


document.getElementById("reply")
.textContent=
message;


document.getElementById("reply")
.scrollIntoView({
behavior:"smooth",
block:"center"
});

}



/* ==============================
   COPY MESSAGE
============================== */


async function copyReply(){

const text=
document.getElementById("reply")
.textContent;


if(
text===
"Select an order to generate a message."
){

alert(
"Please select an order first."
);

return;

}


try{

await navigator.clipboard.writeText(text);

alert(
"Message copied! 📋"
);

}

catch(error){

alert(
"Copy failed. Please copy it manually."
);

}

}



/* ==============================
   CHANGE STATUS
============================== */


function changeStatus(index){

const order=
orders[index];


const statuses=[
"Pending",
"Confirmed",
"Delivered"
];


const current=
statuses.indexOf(order.status);


const next=
(current+1)
% statuses.length;


order.status=
statuses[next];


saveOrders();


displayOrders();


updateStats();

}



/* ==============================
   DELETE ORDER
============================== */


function deleteOrder(index){

const confirmed=
confirm(
"Delete this order?"
);


if(!confirmed){

return;

}


orders.splice(index,1);


saveOrders();


displayOrders();


updateStats();

}



/* ==============================
   SHOP STATISTICS
============================== */


function updateStats(){

const total=
orders.length;


const confirmed=
orders.filter(
order =>
order.status==="Confirmed" ||
order.status==="Delivered"
).length;


const sales=
orders.reduce(
(sum,order)=>
sum+order.total,
0
);


document.getElementById(
"totalOrders"
).textContent=
total;


document.getElementById(
"confirmedOrders"
).textContent=
confirmed;


document.getElementById(
"totalSales"
).textContent=
"₹"+sales.toLocaleString("en-IN");

}



/* ==============================
   CLEAR FORM
============================== */


function clearOrderForm(){

document.getElementById(
"customerName"
).value="";


document.getElementById(
"customerPhone"
).value="";


document.getElementById(
"orderProduct"
).value="";


document.getElementById(
"quantity"
).value=1;


document.getElementById(
"orderStatus"
).value="Pending";

}



/* ==============================
   SECURITY
============================== */


function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/* ==============================
   START APP
============================== */


saveProducts();

loadProducts();

displayOrders();

updateStats();


</script>

</body>
</html>
