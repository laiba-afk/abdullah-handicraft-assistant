<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdullah Handicraft</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f3ee;
  color:#292522;
}

header{
  background:#292522;
  color:white;
  padding:28px 18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
  color:#ddd;
}

.container{
  max-width:950px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
  margin-top:0;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:1px solid #ddd4cb;
  border-radius:10px;
  font-size:15px;
}

button{
  border:none;
  border-radius:10px;
  padding:12px 16px;
  margin:6px 4px 0 0;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#292522;
  color:white;
}

.secondary{
  background:#eee7df;
  color:#292522;
}

.danger{
  background:#ead8d3;
  color:#722b22;
}

.product{
  border:1px solid #e5ddd5;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
}

.product-image{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:12px;
}

.product-name{
  font-size:20px;
  font-weight:bold;
}

.price{
  font-size:22px;
  font-weight:bold;
  margin:8px 0;
}

.detail{
  color:#625b55;
  margin:5px 0;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#eee7df;
  font-size:12px;
  margin-top:5px;
}

.available{
  color:green;
  font-weight:bold;
}

.out{
  color:#b3261e;
  font-weight:bold;
}

.reply{
  background:#f5f1ec;
  padding:16px;
  border-radius:12px;
  white-space:pre-wrap;
  line-height:1.6;
  min-height:120px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}

.empty{
  color:#777;
  padding:12px 0;
}

</style>
</head>

<body>

<header>

<h1>Abdullah Handicraft</h1>

<p>Smart Shop Assistant • Version 2</p>

</header>


<div class="container">


<!-- PRODUCT SEARCH -->

<section class="card">

<h2>🔎 Find Products</h2>

<input
id="search"
type="text"
placeholder="Search product..."
oninput="displayProducts()"
>

<select
id="categoryFilter"
onchange="displayProducts()"
>

<option value="all">
All Categories
</option>

<option value="Dresses">
Dresses
</option>

<option value="Bedsheets">
Bedsheets
</option>

<option value="Sarees">
Sarees
</option>

<option value="Pillow Covers">
Pillow Covers
</option>

<option value="Kurti">
Kurti
</option>

<option value="Plazo Set">
Plazo Set
</option>

</select>

<div id="products"></div>

</section>


<!-- ADD PRODUCT -->

<section class="card">

<h2>➕ Add Product</h2>

<input
id="productName"
placeholder="Product name"
>

<select id="productCategory">

<option value="Dresses">
Dresses
</option>

<option value="Bedsheets">
Bedsheets
</option>

<option value="Sarees">
Sarees
</option>

<option value="Pillow Covers">
Pillow Covers
</option>

<option value="Kurti">
Kurti
</option>

<option value="Plazo Set">
Plazo Set
</option>

</select>

<input
id="productPrice"
type="number"
placeholder="Price ₹"
>

<input
id="fabric"
placeholder="Fabric / Material"
>

<input
id="top"
placeholder="Top measurement"
>

<input
id="bottom"
placeholder="Bottom measurement"
>

<input
id="dupatta"
placeholder="Dupatta measurement"
>

<input
id="image"
placeholder="Product image URL (optional)"
>

<select id="stock">

<option value="Available">
Available
</option>

<option value="Out of Stock">
Out of Stock
</option>

</select>

<button
class="primary"
onclick="addProduct()"
>

Add Product

</button>

</section>


<!-- WHATSAPP ASSISTANT -->

<section class="card">

<h2>💬 Customer Reply Assistant</h2>

<select id="replyType">

<option value="details">
Product Details
</option>

<option value="price">
Price Reply
</option>

<option value="availability">
Availability Reply
</option>

<option value="order">
Order Reply
</option>

<option value="delivery">
Delivery Reply
</option>

</select>

<div
id="reply"
class="reply"
>

Select a product to generate a reply.

</div>

<button
class="primary"
onclick="copyReply()"
>

📋 Copy Reply

</button>

</section>


</div>


<footer>

© 2026 Abdullah Handicraft

</footer>


<script>


/* ===========================
   PRODUCT DATABASE
=========================== */


let products =
JSON.parse(
localStorage.getItem("abdullahProducts")
);


if(!products){

products=[

{

name:"Cotton Light Dress",

category:"Dresses",

price:350,

fabric:"Cotton fabric",

top:"2.25 meters",

bottom:"2.25 meters",

dupatta:"2.25 meters",

image:"",

stock:"Available"

}

];

saveProducts();

}


let selectedProduct=null;


/* ===========================
   SAVE
=========================== */


function saveProducts(){

localStorage.setItem(
"abdullahProducts",
JSON.stringify(products)
);

}


/* ===========================
   DISPLAY
=========================== */


function displayProducts(){

const container=
document.getElementById("products");

const search=
document.getElementById("search")
.value
.toLowerCase();

const category=
document.getElementById("categoryFilter")
.value;


const filtered=
products.filter(product=>{

const matchesSearch=
product.name
.toLowerCase()
.includes(search);

const matchesCategory=
category==="all" ||
product.category===category;

return matchesSearch &&
matchesCategory;

});


if(filtered.length===0){

container.innerHTML=
'<div class="empty">No products found.</div>';

return;

}


container.innerHTML="";


filtered.forEach(product=>{

const index=
products.indexOf(product);


const div=
document.createElement("div");

div.className="product";


let imageHTML="";

if(product.image){

imageHTML=
`
<img
class="product-image"
src="${escapeHTML(product.image)}"
alt="${escapeHTML(product.name)}"
onerror="this.style.display='none'"
>
`;

}


div.innerHTML=`

${imageHTML}

<div class="product-name">

${escapeHTML(product.name)}

</div>

<div class="badge">

${escapeHTML(product.category)}

</div>

<div class="price">

₹${Number(product.price)
.toLocaleString("en-IN")}

</div>

<div class="detail">

🧵 Material:
${escapeHTML(product.fabric || "Not specified")}

</div>

${
product.top
?
`<div class="detail">
👕 Top: ${escapeHTML(product.top)}
</div>`
:""
}

${
product.bottom
?
`<div class="detail">
👖 Bottom: ${escapeHTML(product.bottom)}
</div>`
:""
}

${
product.dupatta
?
`<div class="detail">
🧣 Dupatta: ${escapeHTML(product.dupatta)}
</div>`
:""
}

<div class="${
product.stock==="Available"
?
"available"
:
"out"
}">

${
product.stock==="Available"
?
"● Available"
:
"● Out of Stock"
}

</div>


<button
class="primary"
onclick="generateReply(${index})"
>

💬 Generate Reply

</button>


<button
class="danger"
onclick="deleteProduct(${index})"
>

🗑 Delete

</button>

`;


container.appendChild(div);

});

}


/* ===========================
   GENERATE REPLY
=========================== */


function generateReply(index){

selectedProduct=
products[index];

const product=
selectedProduct;

const type=
document.getElementById("replyType")
.value;


let reply="";


if(type==="details"){

reply=
`Hi 😊

Here are the details of our ${product.name}:

💰 Price: ₹${product.price}
🧵 Fabric: ${product.fabric || "Not specified"}
${product.top ? "👕 Top: "+product.top : ""}
${product.bottom ? "👖 Bottom: "+product.bottom : ""}
${product.dupatta ? "🧣 Dupatta: "+product.dupatta : ""}
📦 Availability: ${product.stock}

If you'd like to order, please let us know. 😊`;

}


if(type==="price"){

reply=
`Hi 😊

The price of our ${product.name} is ₹${product.price}.

Please let us know if you'd like to order. 🛍️`;

}


if(type==="availability"){

reply=
`Hi 😊

${product.name} is currently ${
product.stock==="Available"
?
"available"
:
"out of stock"
}.

Please let us know if you need any other details.`;

}


if(type==="order"){

reply=
`Hi 😊

Thank you for your interest in ${product.name}.

Price: ₹${product.price}

To place an order, please send your required product details and delivery information.

Thank you for shopping with Abdullah Handicraft! 🛍️`;

}


if(type==="delivery"){

reply=
`Hi 😊

Your ${product.name} can be ordered through Abdullah Handicraft.

For delivery details and charges, please share your location with us so we can confirm the available delivery option.

Thank you! ❤️`;

}


document.getElementById("reply")
.textContent=reply;

document.getElementById("reply")
.scrollIntoView({
behavior:"smooth",
block:"center"
});

}


/* ===========================
   COPY
=========================== */


async function copyReply(){

const text=
document.getElementById("reply")
.textContent;

if(
text===
"Select a product to generate a reply."
){

alert("Please select a product first.");

return;

}


try{

await navigator.clipboard.writeText(text);

alert("Reply copied! 📋");

}

catch(error){

alert(
"Copy failed. Please copy the text manually."
);

}

}


/* ===========================
   ADD PRODUCT
=========================== */


function addProduct(){

const product={

name:
document.getElementById("productName")
.value.trim(),

category:
document.getElementById("productCategory")
.value,

price:
Number(
document.getElementById("productPrice")
.value
),

fabric:
document.getElementById("fabric")
.value.trim(),

top:
document.getElementById("top")
.value.trim(),

bottom:
document.getElementById("bottom")
.value.trim(),

dupatta:
document.getElementById("dupatta")
.value.trim(),

image:
document.getElementById("image")
.value.trim(),

stock:
document.getElementById("stock")
.value

};


if(
!product.name ||
!product.price
){

alert(
"Please enter product name and price."
);

return;

}


products.push(product);

saveProducts();

displayProducts();

clearForm();

alert(
"Product added successfully! 🎉"
);

}


/* ===========================
   CLEAR FORM
=========================== */


function clearForm(){

document.getElementById("productName")
.value="";

document.getElementById("productPrice")
.value="";

document.getElementById("fabric")
.value="";

document.getElementById("top")
.value="";

document.getElementById("bottom")
.value="";

document.getElementById("dupatta")
.value="";

document.getElementById("image")
.value="";

}


/* ===========================
   DELETE
=========================== */


function deleteProduct(index){

const confirmed=
confirm(
`Delete "${products[index].name}"?`
);


if(!confirmed){

return;

}


products.splice(index,1);

saveProducts();

displayProducts();

}


/* ===========================
   SECURITY
=========================== */


function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ===========================
   START
=========================== */


displayProducts();

</script>

</body>
</html>
